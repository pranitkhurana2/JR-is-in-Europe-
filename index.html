<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How much do you miss me? 💕</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffe3ec;
    font-family: "Trebuchet MS", sans-serif;
    text-align: center;
    overflow: hidden;
  }
  .otter { width: 240px; max-width: 80vw; height: auto; border-radius: 16px; }
  h1 { color: #c2185b; margin: 16px 12px; }
  .buttons { display: flex; gap: 20px; align-items: center; justify-content: center; }
  button {
    font-size: 1.1rem;
    padding: 12px 24px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
  }
  #yes { background: #e91e63; }
  #no { background: #9e9e9e; }
  #celebrate { font-size: 2rem; color: #c2185b; font-weight: bold; margin-top: 20px; display: none; }
</style>
</head>
<body>
  <img class="otter" src="https://media1.tenor.com/m/5Ro1cyoNZKYAAAAC/otter-otter-love.gif" alt="Two cute otters hugging">
  <h1 id="question">How much do you miss me?</h1>
  <div class="buttons">
    <button id="yes">SOOOOO MUCH</button>
    <button id="no">eh not much</button>
  </div>
  <div id="celebrate">I miss you too :)</div>

<script>
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');

  function dodge() {
    // Switch to fixed positioning so it can jump anywhere on screen
    no.style.position = 'fixed';
    const maxX = window.innerWidth - no.offsetWidth - 10;
    const maxY = window.innerHeight - no.offsetHeight - 10;
    no.style.left = Math.max(10, Math.random() * maxX) + 'px';
    no.style.top = Math.max(10, Math.random() * maxY) + 'px';
  }

  no.addEventListener('mouseover', dodge);
  no.addEventListener('touchstart', function (e) { e.preventDefault(); dodge(); });
  no.addEventListener('click', function (e) { e.preventDefault(); dodge(); });

  yes.addEventListener('click', function () {
    document.getElementById('celebrate').style.display = 'block';
    no.style.display = 'none';
  });
</script>
</body>
</html>
